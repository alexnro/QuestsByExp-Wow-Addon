# Builds the addon zip and uploads it to CurseForge and a GitHub Release
# whenever a version tag (e.g. v0.4.0) is pushed.
# Needs the CF_API_KEY repository secret (Settings > Secrets and variables > Actions).
name: Package and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
